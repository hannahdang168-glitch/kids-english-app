name: Copy newest version to index.html

on:
  push:
    paths:
      - '.github/workflows/copy-to-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-to-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy newest LumiKids version to index.html
        run: cp monkey-vs-easy-kids-english-apps.html index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Replace index.html with newest LumiKids version" -m "LumiKids kids English app with new Rosetta Stone picture-thinking learning area: learn by pictures, no Vietnamese translation, counting with real quantities, colours through pictures, sentence patterns."
          git push
