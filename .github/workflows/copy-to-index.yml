name: Copy monkey file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy monkey file to index.html
        run: cp monkey-vs-easy-kids-english-apps.html index.html
      - name: Commit index.html
        run: |
          git config user.name "hannahdang168-glitch"
          git config user.email "hannahdang168-glitch@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update index.html from monkey-vs-easy-kids-english-apps.html (LumiKids kid voice Mia re-processed)"
          git push
