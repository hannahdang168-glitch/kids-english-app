name: Rename uploaded file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore newest file and make it index.html
        run: |
          set -e
          git config user.name "hannahdang168-glitch"
          git config user.email "hannahdang168-glitch@users.noreply.github.com"
          git pull --rebase origin main
          git checkout b6b478b -- monkey-vs-easy-kids-english-apps.html
          test "$(wc -c < monkey-vs-easy-kids-english-apps.html)" = "12976602"
          rm -f test-rename.html index.html
          git mv monkey-vs-easy-kids-english-apps.html index.html
          ls -l
          git add -A
          git status --short
          git commit -m "Replace index.html with new LumiKids version" || echo "nothing to commit"
          git push origin main
