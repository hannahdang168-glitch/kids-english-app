name: Rename monkey file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "hannahdang168-glitch"
          git config user.email "hannahdang168-glitch@users.noreply.github.com"
          ls -la
          git mv monkey-vs-easy-kids-english-apps.html index.html
          git status
          git commit -m "Replace index.html with new redesigned LumiKids version with zone colors, giant next-action button, stars, sticker shelf, talking Lumi guide and birth-year parent gate"
          git push
